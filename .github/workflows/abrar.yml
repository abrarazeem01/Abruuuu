name: Continuous Validation Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Validate README file exists
        run: |
          if [ -f README.md ]; then
            echo "README exists"
          else
            echo "README missing"
            exit 1
          fi

      - name: Validate YAML syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          yamllint .

      - name: Generate Report
        run: |
          echo "Continuous Validation Report"
          echo "All validation steps executed"
